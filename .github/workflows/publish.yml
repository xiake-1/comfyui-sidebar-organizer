# Publishes new versions to the Comfy Registry (https://registry.comfy.org).
# Triggered by pushing a version tag (e.g. v0.1.0) or manually via the
# Actions tab. Requires a repository secret `REGISTRY_ACCESS_TOKEN` holding a
# Comfy Registry API key (registry.comfy.org -> account -> API keys).
name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Publish node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
